<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RideGo - Passenger</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header>
        <div class="brand"><span class="brand-dot"></span> RideGo</div>
        <a href="/" class="badge">Switch role</a>
      </header>

      <!-- BEFORE BOOKING -->
      <section id="bookPanel">
        <div class="card">
          <h4>Your trip</h4>
          <label class="field">
            <span class="lbl">Pickup</span>
            <input id="pickupLabel" class="input" placeholder="Tap the map to set pickup" readonly />
          </label>
          <label class="field">
            <span class="lbl">Drop-off</span>
            <input id="dropLabel" class="input" placeholder="Tap the map to set drop" readonly />
          </label>
          <p class="muted" id="tapHint">Tap the map: 1st tap = pickup, 2nd tap = drop. Tap again to reset.</p>
        </div>

        <div class="card" id="estimateCard" style="display:none;">
          <h4>Estimate</h4>
          <div class="kv"><span class="k">Distance</span><span class="v" id="estDistance">-</span></div>
          <div class="kv"><span class="k">ETA</span><span class="v" id="estDuration">-</span></div>
          <div class="kv"><span class="k">Fare</span><span class="v" id="estFare">-</span></div>
        </div>

        <button id="requestBtn" class="btn" disabled>Request ride</button>
      </section>

      <!-- DURING RIDE -->
      <section id="ridePanel" style="display:none;">
        <div class="card">
          <h4>Status</h4>
          <div class="kv"><span class="k">Ride</span><span class="v" id="rideId">-</span></div>
          <div class="kv"><span class="k">State</span><span class="v" id="rideState"><span class="badge live online">searching</span></span></div>
          <div class="kv"><span class="k">Fare estimate</span><span class="v" id="rideFare">-</span></div>
        </div>
        <div class="card" id="driverCard" style="display:none;">
          <h4>Your driver</h4>
          <div class="kv"><span class="k">Name</span><span class="v" id="drvName">-</span></div>
          <div class="kv"><span class="k">Vehicle</span><span class="v" id="drvVehicle">-</span></div>
          <div class="kv"><span class="k">Plate</span><span class="v" id="drvPlate">-</span></div>
        </div>
        <button id="cancelBtn" class="btn danger">Cancel ride</button>
      </section>

      <!-- COMPLETED -->
      <section id="donePanel" style="display:none;">
        <div class="card">
          <h4>Trip complete</h4>
          <div class="kv"><span class="k">Final fare</span><span class="v" id="finalFare">-</span></div>
          <p class="muted">Thanks for riding with RideGo.</p>
        </div>
        <button class="btn" onclick="location.reload()">Book another</button>
      </section>
    </aside>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script>
    const socket = io();
    const map = L.map('map').setView([DEFAULT_CENTER.lat, DEFAULT_CENTER.lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19,
    }).addTo(map);

    let pickup = null, drop = null;
    let pickupMarker = null, dropMarker = null;
    let driverMarkers = {}; // id -> marker
    let assignedDriverMarker = null;
    let routeLine = null;
    let activeRide = null;

    // Try to center on user's location
    tryGetMyLocation((loc) => map.setView([loc.lat, loc.lng], 14));

    // ----- Map taps to set pickup/drop -----
    map.on('click', async (e) => {
      const { lat, lng } = e.latlng;
      if (!pickup) {
        pickup = { lat, lng };
        pickupMarker = L.marker([lat, lng], { icon: makeIcon('A', 'pickup') }).addTo(map);
        document.getElementById('pickupLabel').value = 'Locating...';
        document.getElementById('pickupLabel').value = await reverseGeocode(lat, lng);
      } else if (!drop) {
        drop = { lat, lng };
        dropMarker = L.marker([lat, lng], { icon: makeIcon('B', 'drop') }).addTo(map);
        document.getElementById('dropLabel').value = 'Locating...';
        document.getElementById('dropLabel').value = await reverseGeocode(lat, lng);
        drawRouteLine();
        await refreshEstimate();
      } else {
        // reset
        if (pickupMarker) map.removeLayer(pickupMarker);
        if (dropMarker) map.removeLayer(dropMarker);
        if (routeLine) map.removeLayer(routeLine);
        pickup = drop = null; pickupMarker = dropMarker = routeLine = null;
        document.getElementById('pickupLabel').value = '';
        document.getElementById('dropLabel').value = '';
        document.getElementById('estimateCard').style.display = 'none';
        document.getElementById('requestBtn').disabled = true;
      }
    });

    function drawRouteLine() {
      if (routeLine) map.removeLayer(routeLine);
      if (pickup && drop) {
        routeLine = L.polyline([[pickup.lat, pickup.lng], [drop.lat, drop.lng]], {
          color: '#ffd400', weight: 4, opacity: 0.85, dashArray: '6, 8',
        }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
      }
    }

    async function refreshEstimate() {
      if (!pickup || !drop) return;
      const u = `/api/estimate?plat=${pickup.lat}&plng=${pickup.lng}&dlat=${drop.lat}&dlng=${drop.lng}`;
      const r = await fetch(u);
      if (!r.ok) return;
      const j = await r.json();
      document.getElementById('estDistance').textContent = fmtKm(j.distanceKm);
      document.getElementById('estDuration').textContent = `${j.durationMin.toFixed(0)} min`;
      document.getElementById('estFare').textContent = fmtLKR(j.fare);
      document.getElementById('estimateCard').style.display = '';
      document.getElementById('requestBtn').disabled = false;
    }

    // ----- Register passenger and listen to driver list -----
    const passengerId = 'P-' + Math.random().toString(36).slice(2, 8);
    socket.emit('passenger:register', { passengerId, name: 'Passenger' }, () => {});

    socket.on('drivers:update', (list) => {
      // Keep only currently-online driver markers; remove gone
      const seen = new Set();
      for (const d of list) {
        if (!d.location) continue;
        seen.add(d.id);
        if (driverMarkers[d.id]) {
          driverMarkers[d.id].setLatLng([d.location.lat, d.location.lng]);
        } else {
          driverMarkers[d.id] = L.marker([d.location.lat, d.location.lng], {
            icon: makeIcon(d.busy ? 'X' : '\u2713', 'driver'),
            zIndexOffset: 100,
          }).addTo(map).bindPopup(`${d.name}<br>${d.vehicle} - ${d.plate}`);
        }
      }
      for (const id of Object.keys(driverMarkers)) {
        if (!seen.has(id)) { map.removeLayer(driverMarkers[id]); delete driverMarkers[id]; }
      }
    });

    // ----- Request ride -----
    document.getElementById('requestBtn').onclick = () => {
      if (!pickup || !drop) return;
      const btn = document.getElementById('requestBtn');
      btn.disabled = true; btn.textContent = 'Requesting...';
      socket.emit(
        'passenger:request',
        {
          pickup, drop,
          pickupLabel: document.getElementById('pickupLabel').value,
          dropLabel: document.getElementById('dropLabel').value,
        },
        (resp) => {
          if (!resp.ok) {
            toast(resp.error === 'no_drivers_available' ? 'No drivers nearby - try again' : 'Failed to request');
            btn.disabled = false; btn.textContent = 'Request ride';
            return;
          }
          activeRide = resp.ride;
          document.getElementById('bookPanel').style.display = 'none';
          document.getElementById('ridePanel').style.display = '';
          document.getElementById('rideId').textContent = resp.ride.id;
          document.getElementById('rideFare').textContent = fmtLKR(resp.ride.estimateFare);
          setState('searching');
        },
      );
    };

    // ----- Cancel -----
    document.getElementById('cancelBtn').onclick = () => {
      if (!activeRide) return;
      socket.emit('passenger:cancel', { rideId: activeRide.id });
      toast('Ride cancelled');
      setTimeout(() => location.reload(), 600);
    };

    // ----- Status updates -----
    function setState(label, kind = 'online') {
      document.getElementById('rideState').innerHTML = `<span class="badge live ${kind}">${label}</span>`;
    }

    socket.on('ride:accepted', ({ ride, driver }) => {
      activeRide = ride;
      setState('driver on the way');
      document.getElementById('driverCard').style.display = '';
      document.getElementById('drvName').textContent = driver.name;
      document.getElementById('drvVehicle').textContent = driver.vehicle;
      document.getElementById('drvPlate').textContent = driver.plate;
      toast(`${driver.name} is coming!`);
      if (driver.location) {
        if (assignedDriverMarker) map.removeLayer(assignedDriverMarker);
        assignedDriverMarker = L.marker([driver.location.lat, driver.location.lng], {
          icon: makeIcon('D', 'driver'),
          zIndexOffset: 1000,
        }).addTo(map);
      }
    });

    socket.on('ride:driverLocation', ({ location }) => {
      if (!assignedDriverMarker) {
        assignedDriverMarker = L.marker([location.lat, location.lng], {
          icon: makeIcon('D', 'driver'), zIndexOffset: 1000,
        }).addTo(map);
      } else {
        assignedDriverMarker.setLatLng([location.lat, location.lng]);
      }
    });

    socket.on('ride:arrived', () => { setState('driver arrived'); toast('Your driver has arrived'); });
    socket.on('ride:started',  () => { setState('on trip', 'online'); toast('Trip started'); });
    socket.on('ride:completed', ({ fare }) => {
      document.getElementById('ridePanel').style.display = 'none';
      document.getElementById('donePanel').style.display = '';
      document.getElementById('finalFare').textContent = fmtLKR(fare);
    });
    socket.on('ride:expired', () => { toast('No drivers responded - try again'); setTimeout(() => location.reload(), 1200); });
    socket.on('ride:driverDisconnected', () => toast('Driver lost connection'));
  </script>
</body>
</html>
